services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: tiktokget
      POSTGRES_PASSWORD: tiktokget
      POSTGRES_DB: tiktokget
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
  redis:
    image: redis:7
    ports: ["6379:6379"]
volumes:
  pgdata: